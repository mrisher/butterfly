<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <!-- Top wings (neon pink) -->
  <polygon points="25,25 5,10 15,25" fill="#f43f5e"/>
  <polygon points="25,25 45,10 35,25" fill="#f43f5e"/>
  <!-- Bottom wings (darker rose) -->
  <polygon points="25,25 10,38 22,33" fill="#be123c"/>
  <polygon points="25,25 40,38 28,33" fill="#be123c"/>
  <!-- Antennae -->
  <line x1="25" y1="25" x2="20" y2="5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="25" y1="25" x2="30" y2="5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>
  <!-- Body -->
  <circle cx="25" cy="25" r="3.5" fill="#0f172a"/>
  <rect x="23.5" y="14" width="3" height="22" fill="#0f172a"/>
</svg>